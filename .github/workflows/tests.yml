name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (without bench)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run the core tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-core
          path: coverage.xml
          if-no-files-found: ignore

  frappe:
    name: Frappe site (ERPNext v16)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Set up a bench with Frappe and ERPNext version-16
        run: |
          pip install frappe-bench==5.31.1
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch version-16 ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install the app on a test site
        working-directory: /home/runner/frappe-bench
        env:
          CI: 'Yes'
        run: |
          bench get-app erpnext --branch version-16
          bench get-app briefbote "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app briefbote

      - name: Run the Frappe tests
        working-directory: /home/runner/frappe-bench
        env:
          TYPE: server
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app briefbote

      - name: Write the documents of the proof of the printouts
        if: ${{ !cancelled() }}
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site execute briefbote.tests.print_documents.run

      - name: Install wkhtmltopdf and Poppler for the printouts
        if: ${{ !cancelled() }}
        # The image of a site installs wkhtmltopdf 0.12.6.1-3 with patched Qt from the packages of the wkhtmltopdf
        # project; the same build for Ubuntu, checked by its SHA-256, renders the printouts here. Poppler reads the
        # words of their pages for the checks; Ghostscript converts drafts to PDF/A-3 as eu_einvoice does.
        env:
          WKHTMLTOPDF: https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          WKHTMLTOPDF_SHA256: 4f723b2691ad8638a9df960e0421d346d7315083e3583a334f33362280ddba15
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/wkhtmltox.deb" "$WKHTMLTOPDF"
          echo "$WKHTMLTOPDF_SHA256  $RUNNER_TEMP/wkhtmltox.deb" | sha256sum --check --strict
          sudo apt-get install -y "$RUNNER_TEMP/wkhtmltox.deb" poppler-utils ghostscript
          wkhtmltopdf --version

      - name: Print every print format as PDF and check its pages
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        # briefbote/tests/print_proof.py: each print format in German for the documents of print_documents.py, on
        # blank and on pre-printed paper, with wkhtmltopdf and with Frappe's Chromium-based generator (the Chrome of
        # the runner), as on a site; the step fails on a printout with a problem. The URL of the site points at a host
        # that does not exist, so that a print format that loads anything fails.
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g chromium_path "$(command -v google-chrome)"
          bench --site test_site set-config host_name http://print-proof.invalid
          bench --site test_site execute briefbote.tests.print_proof.run --kwargs "{'directory': '$RUNNER_TEMP/printouts'}"

      - name: Print the documents of sales as PDF and check their pages
        if: ${{ !cancelled() }}
        # briefbote/tests/print_proof_sales.py and print_proof_dunning.py: Angebot, Auftragsbestätigung, Lieferschein
        # Mahnung, Zahlungsbestätigung, Quittung, Bestellung, Anfrage, Lieferantenrücksendung and Packliste for the
        # documents of print_documents_sales.py, _dunning.py, _payment.py, _purchase.py and _goods.py, with the
        # checks of the step above.
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute briefbote.tests.print_documents_sales.run
          bench --site test_site execute briefbote.tests.print_proof_sales.run --kwargs "{'directory': '$RUNNER_TEMP/printouts/verkauf'}"
          bench --site test_site execute briefbote.tests.print_documents_dunning.run
          bench --site test_site execute briefbote.tests.print_proof_dunning.run --kwargs "{'directory': '$RUNNER_TEMP/printouts/mahnung'}"
          bench --site test_site execute briefbote.tests.print_documents_payment.run
          bench --site test_site execute briefbote.tests.print_proof_payment.run --kwargs "{'directory': '$RUNNER_TEMP/printouts/zahlung'}"
          bench --site test_site execute briefbote.tests.print_documents_purchase.run
          bench --site test_site execute briefbote.tests.print_proof_purchase.run --kwargs "{'directory': '$RUNNER_TEMP/printouts/einkauf'}"
          bench --site test_site execute briefbote.tests.print_documents_goods.run
          bench --site test_site execute briefbote.tests.print_proof_goods.run --kwargs "{'directory': '$RUNNER_TEMP/printouts/waren'}"

      - name: Print the examples of the README and compare them with the repository
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        # briefbote/tests/print_examples.py: one printout of each print format and four more from the documents of
        # the proof, as PDF and PNG; the step fails where the files under docs/ differ from them. The artifact
        # beispiele holds the new files at their paths in the repository.
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute briefbote.tests.print_examples.run --kwargs "{'directory': '$RUNNER_TEMP/beispiele'}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: beispiele
          path: ${{ runner.temp }}/beispiele
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: printouts
          path: ${{ runner.temp }}/printouts
          if-no-files-found: ignore

      - name: Build the assets of the desk for the browser tests
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        # bench init --skip-assets leaves out the bundles of Frappe. They are built without the build commands of
        # Frappe's sub-projects, which the desk does not load.
        working-directory: /home/runner/frappe-bench
        run: |
          yarn --cwd apps/frappe run production --apps frappe
          bench compile-po-to-mo --app frappe --locale de
          bench --site test_site clear-cache

      - name: Start the test site
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        # DEV_SERVER sends the desk to socket.io on its own port, as bench start does, and the default site tells
        # socket.io which site localhost is.
        working-directory: /home/runner/frappe-bench
        run: |
          mkdir -p "$RUNNER_TEMP/browser-results"
          bench use test_site
          DEV_SERVER=1 nohup bench --site test_site serve --port 8000 --noreload > "$RUNNER_TEMP/browser-results/web.log" 2>&1 &
          nohup node apps/frappe/socketio.js > "$RUNNER_TEMP/browser-results/socketio.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://localhost:8000/api/method/ping

      - name: Install Playwright and Chromium
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          python -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/pip" install -r requirements-dev.txt
          "$RUNNER_TEMP/browser-venv/bin/playwright" install --with-deps --only-shell chromium

      - name: Print from the print view with the buttons a user sees
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        # briefbote/tests/e2e: „Drucken“ must print the PDF of the generator, with its pages, page numbers and table
        # heads; the browser's own print of /printview falls back on the print stylesheet. The PDFs land in the
        # artifact browser-tests.
        run: |
          "$RUNNER_TEMP/browser-venv/bin/python" -m pytest briefbote/tests/e2e --base-url http://localhost:8000 \
            --output "$RUNNER_TEMP/browser-results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-tests
          path: ${{ runner.temp }}/browser-results
          if-no-files-found: ignore
