     soft-body and soft-accent are Frappe's: they draw the icon in the tones of the surface that holds it,
     like the module icons of ERPNext beside it. -->

<svg id="briefbote-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
