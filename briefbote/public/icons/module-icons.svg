		<path d="M3.5 6.5h17v11h-17Z" class="soft-body"/>
		<path d="M3.5 6.5h17L12 13Z" class="soft-accent"/>
		<path d="M3.5 6.5h17v11h-17ZM3.5 6.5 12 13l8.5-6.5M6.5 14.5h4"/>
	</symbol>
</svg>
